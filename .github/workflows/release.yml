name: release
# On a published release: build draai.pyz from the tagged commit, attach it
# to the release, and point the Homebrew formula at it.
# Needs the HOMEBREW_TAP_TOKEN secret: a fine-grained token with
# "Contents: read and write" on itsmesaskovic/homebrew-draai only.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re)publish, e.g. v2.7.0"
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tag matches __version__
        run: |
          v=$(python -c "import draai; print(draai.__version__)")
          if [ "v$v" != "$TAG" ]; then echo "::error::tag $TAG but draai.__version__ is $v"; exit 1; fi

      - name: Test
        run: python tests/test_draai.py

      - name: Build and attach draai.pyz
        run: |
          python build.py
          gh release upload "$TAG" draai.pyz --clobber
          echo "SHA=$(sha256sum draai.pyz | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Verify the published asset
        run: |
          curl -fsSL -o published.pyz "https://github.com/${{ github.repository }}/releases/download/$TAG/draai.pyz"
          echo "$SHA  published.pyz" | sha256sum -c -

      - name: Update the Homebrew formula
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then echo "::warning::HOMEBREW_TAP_TOKEN not set; formula not updated"; exit 0; fi
          git clone -q "https://x-access-token:$TAP_TOKEN@github.com/itsmesaskovic/homebrew-draai.git" tap
          cd tap
          sed -i -E "s|releases/download/v[^/]+/draai.pyz|releases/download/$TAG/draai.pyz|; s|^  sha256 \"[0-9a-f]+\"|  sha256 \"$SHA\"|" Formula/draai.rb
          git diff --stat
          if git diff --quiet; then echo "formula already at $TAG"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "draai ${TAG#v}"
          git push -q origin HEAD
